name: Publish Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11+ for trusted publishing (OIDC)
        run: |
          # Workaround: Node 22.22.2 bundles a broken npm 10.9.7 that cannot
          # self-upgrade directly to npm@11 (missing promise-retry module).
          # See: https://github.com/npm/cli/issues/9151
          npm install -g npm@11.11.0
          npm install -g npm@11

      - name: Check if version exists on npm
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if npm view @factory/droid-sdk@$VERSION version 2>/dev/null; then
            echo "::notice::Version $VERSION already published. Skipping."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not published. Will publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - run: npm ci
        if: steps.version.outputs.should_publish == 'true'

      - name: Lint
        if: steps.version.outputs.should_publish == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.version.outputs.should_publish == 'true'
        run: npm run typecheck

      - name: Format check
        if: steps.version.outputs.should_publish == 'true'
        run: npm run format:check

      - run: npm run build
        if: steps.version.outputs.should_publish == 'true'

      - run: npm test
        if: steps.version.outputs.should_publish == 'true'

      - run: npm publish --access public
        if: steps.version.outputs.should_publish == 'true'
