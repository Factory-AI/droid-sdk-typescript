name: Publish Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm 11+ for trusted publishing (OIDC)
        run: npm install -g npm@11

      - name: Check if version exists on npm
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if npm view @factory/droid-sdk@$VERSION version 2>/dev/null; then
            echo "::notice::Version $VERSION already published. Skipping."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not published. Will publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - run: npm ci
        if: steps.version.outputs.should_publish == 'true'

      - run: npm run build
        if: steps.version.outputs.should_publish == 'true'

      - run: npm test
        if: steps.version.outputs.should_publish == 'true'

      - run: npm publish --access public
        if: steps.version.outputs.should_publish == 'true'
